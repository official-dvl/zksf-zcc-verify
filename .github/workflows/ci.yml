name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # The package itself has no dependencies; pytest is the only test tool.
        run: |
          python -m pip install --upgrade pip
          pip install . pytest

      - name: Run tests
        run: python -m pytest tests -q

  live:
    name: Check live certificates
    runs-on: ubuntu-latest
    # The checker is only worth anything if it agrees with certificates actually
    # in circulation, so this validates the nine real ones the README lists, at
    # least one for every kind of statement ZCC-v0.1, ZHF-v0.1, ZQEC-v0.1 and
    # ZCC-Estimate-v0.2 make. Network-dependent by design.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Validate published certificates
        run: |
          for id in d904e28af0b441e0 fe529e21d7404ff3 5b8b2c4309d44d41 df1d4c698a954051 \
                    063a6fcb82a9464a b358005dc6724273 881ba3500ed94538 66e9fabc9e784425 \
                    9dcf796bd99648a0; do
            echo "--- $id"
            zcc-verify "$id"
          done

  build-dist:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
